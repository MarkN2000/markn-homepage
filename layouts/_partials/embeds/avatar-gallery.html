{{- /* 閲覧時にR2の最新カタログを表示するアバターダウンロードギャラリー。 */ -}}
{{- $catalogURL := . -}}
<section class="avatar-gallery" data-catalog-url="{{ $catalogURL }}" aria-label="アバターダウンロード" aria-busy="true">
  <p class="avatar-gallery-intro" aria-live="polite">アバター一覧を読み込んでいます…</p>
  <div class="avatar-gallery-grid"></div>
  <p class="avatar-gallery-fallback"><a href="{{ $catalogURL }}">アバター一覧を直接開く</a></p>
</section>
{{- $js := resources.Get "js/avatar-gallery.js" | js.Build (dict "minify" true) | fingerprint -}}
<script src="{{ $js.RelPermalink }}" defer></script>
